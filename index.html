<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Calcolatore di sottoreti IP: VLSM, supernetting, suddivisione uguale, configurazione Cisco IOS." />
    <title>Eli6Subnets</title>

    <!--
      FOUT-prevention: reads saved theme from localStorage and sets data-theme
      on <html> before any stylesheet is parsed, so the first paint uses the
      correct colour scheme without flash.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('eli6subnets_theme');
          var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
          document.documentElement.dataset.theme = saved || preferred;
        } catch (_) {
          // localStorage may be unavailable in some private-browsing contexts.
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
